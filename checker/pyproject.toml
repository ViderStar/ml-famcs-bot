[project]
name = "mlcheck"
version = "0.1.0"
description = "Автопроверка домашних заданий курса ML FAMCS Season 2"
requires-python = ">=3.11"
dependencies = [
    "nbformat>=5.10",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "rapidfuzz>=3.9",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16"]

[project.scripts]
mlcheck = "mlcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Пороги и параметры прогона. Меняются без правки кода.

[paths]
roster_csv = "../Github_HWs_ML_s2_2026.csv"
materials  = "../materials"
out        = "../out"

[verdict]
# Домашка засчитана, если нет находок critical и закрыто не меньше этой доли
# обязательных пунктов рубрики.
hw_pass_ratio = 0.70
# Сертификат, если засчитано не меньше этой доли зачётных домашек.
# Округление — вниз, в пользу студентов: при 0.66 от 12 тем нужно 7, а не 8.
certificate_ratio = 0.66

[fetch]
concurrency = 12
timeout_sec = 300

[llm]
model = "claude-sonnet-5"
# Потолок токенов на один ноутбук; всё сверх — обрезается с пометкой в отчёте.
max_notebook_tokens = 40000
max_output_tokens = 4096
# Сколько работ на домашку берём в discovery-проход.
discovery_per_hw = 6

[similarity]
# Порог сходства шинглов, выше которого пара попадает в similarity.csv.
report_threshold = 0.80
shingle_size = 5
# Ячейка, дословно встречающаяся у стольких студентов, считается раздаткой
# и вычитается: не все заготовки курса сохранились в materials.
boilerplate_min_students = 5
# ...и одновременно не меньше такой доли сдавших тему.
boilerplate_min_share = 0.15
# Близкое сходство учитывается только на дельтах хотя бы такого объёма.
near_min_tokens = 300

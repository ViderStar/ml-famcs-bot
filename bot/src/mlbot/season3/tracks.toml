# Направления третьего сезона. Файл, а не константы в коде: преподаватели и
# число занятий уточняются до самого старта, и правка не должна требовать
# пересборки образа. Файл монтируется в контейнер.
#
# `id` попадает в callback_data (`m:s3.trk:<id>`) — держим короткими.
# `teacher` пока пустой: заполняется, когда договорённость есть. Пустой
# преподаватель направление не скрывает — скрывает `is_open = false`.

[season]
title = "Третий сезон"
starts = "2027-02"
about = """
Узкие направления для тех, кто уже прошёл базу: выбираешь одно или несколько, \
у каждого свой преподаватель и 6–8 занятий. Уровень — junior+ / middle.
"""

[[track]]
id = "cv"
title = "Computer Vision"
emoji = "👁"
lessons = 8
teacher = ""
about = """
Свёртки, аугментации, детекция и сегментация. От ResNet до современных \
детекторов; что делать, когда разметки мало.
"""

[[track]]
id = "nlp"
title = "NLP"
emoji = "💬"
lessons = 8
teacher = ""
about = """
Токенизация, эмбеддинги, трансформеры. Классификация, извлечение сущностей, \
дообучение готовых моделей под свою задачу.
"""

[[track]]
id = "rec"
title = "Рекомендательные системы"
emoji = "🎯"
lessons = 7
teacher = ""
about = """
Коллаборативная фильтрация, матричные разложения, двухстадийные схемы \
«кандидаты → переранжирование». Метрики, которые не врут, и оффлайн-онлайн разрыв.
"""

[[track]]
id = "dl"
title = "Deep Learning"
emoji = "🧠"
lessons = 8
teacher = ""
about = """
Backprop своими руками, инициализация, нормализации, регуляризация, \
расписания обучения. Почему сеть не учится и как это увидеть.
"""

[[track]]
id = "ts"
title = "Временные ряды"
emoji = "📈"
lessons = 6
teacher = ""
about = """
Сезонность и тренд, честная валидация по времени, градиентный бустинг на \
признаках лагов. Самая частая ошибка — утечка из будущего.
"""

[[track]]
id = "rl"
title = "Reinforcement Learning"
emoji = "🕹"
lessons = 6
teacher = ""
about = """
Марковские процессы, Q-обучение, policy gradient. Мало данных, много \
взаимодействия — совсем другая инженерия.
"""

[[track]]
id = "voice"
title = "Речь и звук"
emoji = "🎙"
lessons = 6
teacher = ""
about = """
Спектрограммы, распознавание и синтез речи, диаризация. Как готовить звук, \
чтобы модель вообще что-то услышала.
"""
